# Tool configuration only. Runtime dependencies live in requirements.in / requirements.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["logs", "faiss_index", "storage"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI's File()/Form() defaults are the documented pattern.
ignore = ["B008"]
